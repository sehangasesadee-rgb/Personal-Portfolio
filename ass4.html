<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Case 04</title>
    <meta name="keywords" content="web, html, css, javascript, js, java, python">
    <meta name="description" content="World best web development tutorials">
    <meta name="author" content="IJSE">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/normalize.css">

    <style>


        body{
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        div{
            border-radius: 50%;
            height: 300px;
            aspect-ratio: 1/1;
            border: 2px solid red;
            animation-name: circle;
            animation-iteration-count: infinite;
            animation-duration: 3000ms;
            animation-direction: alternate-reverse;

        }


        @keyframes circle{
            from{
                border-radius: 50%;
                height: 300px;
                aspect-ratio: 1/1;
                border: 2px solid red;
            }
            to{
                height: 100px;
                aspect-ratio: 1/1;
                border: 1px solid orange;
            }
        }

    </style>
</head>
<body>
<div></div>

</body>
</html>
