    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .nav {
            display: flex;
            gap: 30px;
            flex-direction: column;
            position: fixed;
            top: 60px;
            left: 0;
            transform-origin: top left;
            transition: transform 0.3s ease;
        }

        .main {
            background: blueviolet;
            width: 60px;
            height: 50px;
            display: flex;
            border-radius: 0 5px 5px 0;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            transition: width 0.5s ease;
        }

        .main:hover {
            width: 250px;
        }

        .main .text {
            color: white;
            padding-left: 20px;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .main:hover .text {
            opacity: 1;
        }

        .main .img {
            min-width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }


        @media (max-width: 1024px) {
            .nav {
                transform: scale(0.8);
                top: 40px;
            }
        }

        @media (max-width: 768px) {
            .nav {
                transform: scale(0.6);
                top: 20px;
            }
        }


        @media (max-width: 480px) {
            .nav {
                transform: scale(0.5);
            }
        }
    </style>

</head>

<body>

<div class="nav">
    <div class="main">
        <span class="text">Menu One</span>
        <div class="img">
            <i class="fa-regular fa-address-book" style="color: rgb(255, 255, 255);"></i>
        </div>
    </div>

    <div class="main">
        <span class="text">Menu Two</span>
        <div class="img">
            <i class="fa-solid fa-truck" style="color: rgb(255, 255, 255);"></i>
        </div>
    </div>

    <div class="main">
        <span class="text">Menu Three</span>
        <div class="img">
            <i class="fa-solid fa-book" style="color: rgb(255, 255, 255);"></i>
        </div>
    </div>

    <div class="main">
        <span class="text">Menu Four</span>
        <div class="img">
            <i class="fa-solid fa-layer-group" style="color: rgb(255, 253, 248);"></i>
        </div>
    </div>

    <div class="main">
        <span class="text">Menu five</span>
        <div class="img">
            <i class="fa-solid fa-cart-shopping" style="color: rgb(255, 255, 255);"></i>
        </div>
    </div>
</div>
