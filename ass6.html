<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive Car Animation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/normalize.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
        }

        .content {
            width: 10000%;
            height: 100vh;
            background-image: url("assests/Car_Animation_Img/sky.jpg");
            background-size: cover;
            position: relative;
            overflow: hidden;
            transform-origin: top left;
            transition: transform 0.3s ease;
        }

        .city {
            width: 10000%;
            height: 600px;
            background-image: url("assests/Car_Animation_Img/city.png");
            position: absolute;
            top: 0;
            animation: cityMove 10s infinite linear;
        }

        .road {
            width: 10000%;
            height: 300px;
            background-image: url("assests/Car_Animation_Img/road.jpg");
            position: absolute;
            top: 250px;
            animation: cityMove 10s infinite linear;
        }

        .car-body {
            width: 400px;
            height: auto;
            left: 500px;
            position: absolute;
            z-index: 1000;
            top: 260px;
        }

        .car-wheel {
            width: 75px;
            height: 75px;
            z-index: 1001;
            position: absolute;
            animation: wheelRotate 1s infinite linear;
        }

        #wheel1 {
            left: 535px;
            top: 366px;
        }

        #wheel2 {
            left: 778px;
            top: 366px;
        }


        @keyframes wheelRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes cityMove {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-5000px);
            }
        }

        @media (max-width: 1024px) {
            .content {
                transform: scale(0.8);
            }
        }


        @media (max-width: 768px) {
            .content {
                transform: scale(0.5);
            }
            .car-body, .car-wheel {
                left: 100px;
            }
            #wheel1 {
                left: 135px;
            }
            #wheel2 {
                left: 378px;
            }
        }

        @media (max-width: 480px) {
            .content {
                transform: scale(0.35);
            }
        }

    </style>
</head>
<body>
<div class="content">
    <div class="city"></div>
    <div class="road"></div>
    <div class="car">
        <img src="assests/Car_Animation_Img/car.png" class="car-body">
        <img src="assests/Car_Animation_Img/wheel.png" class="car-wheel" id="wheel1">
        <img src="assests/Car_Animation_Img/wheel.png" class="car-wheel" id="wheel2">
    </div>
</div>

</body>
</html>
